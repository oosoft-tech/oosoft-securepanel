# /etc/nginx/snippets/ssl-params.conf
# ─────────────────────────────────────────────────────────────────────────────
# Reusable TLS hardening parameters — Mozilla Modern configuration
# https://ssl-config.mozilla.org/#server=nginx&config=modern
#
# Include this file in every SSL server block:
#   include /etc/nginx/snippets/ssl-params.conf;
# ─────────────────────────────────────────────────────────────────────────────

# ── Protocol ─────────────────────────────────────────────────────────────────
# TLS 1.3 preferred; TLS 1.2 retained for compatibility.
# TLS 1.0 and 1.1 are explicitly absent (deprecated, vulnerable).
ssl_protocols TLSv1.2 TLSv1.3;

# ── Cipher suites ────────────────────────────────────────────────────────────
# TLS 1.3 ciphers are not configurable in nginx — OpenSSL chooses them.
# TLS 1.2 ciphers: ECDHE + AESGCM/CHACHA20 only; no CBC, no RC4, no 3DES.
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

# Let the client pick from the approved list — avoids fingerprinting via
# server-preference ordering and is the Mozilla Modern recommendation.
ssl_prefer_server_ciphers off;

# ── Session resumption ────────────────────────────────────────────────────────
# Shared cache across worker processes; 10m ≈ 40 000 sessions.
# Tickets disabled: forward secrecy is lost if the ticket key leaks.
ssl_session_timeout 1d;
ssl_session_cache   shared:SSL:10m;
ssl_session_tickets off;

# ── OCSP stapling ─────────────────────────────────────────────────────────────
# Attach a signed, time-stamped OCSP response to the TLS handshake so the
# client doesn't need to contact the CA separately.
ssl_stapling        on;
ssl_stapling_verify on;
# Upstream resolver used to fetch OCSP responses (Cloudflare + Google).
resolver 1.1.1.1 8.8.8.8 valid=300s;
resolver_timeout    5s;

# ── DH parameters ────────────────────────────────────────────────────────────
# Pre-generated 2048-bit DH params for DHE cipher suites.
# Generate once with: openssl dhparam -out /etc/nginx/dhparam.pem 2048
# Comment out if the file has not been generated yet.
# ssl_dhparam /etc/nginx/dhparam.pem;

# ── Security headers (shared across all panel server blocks) ─────────────────

# HSTS: 2 years, apply to all subdomains, eligible for browser preload list.
# WARNING: only enable preload after confirming ALL subdomains serve HTTPS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

# Prevent the panel being embedded in a frame on another origin.
add_header X-Frame-Options "DENY" always;

# Prevent MIME-type sniffing.
add_header X-Content-Type-Options "nosniff" always;

# Disable legacy XSS filter (modern browsers use CSP instead).
add_header X-XSS-Protection "0" always;

# Restrict what the browser sends as Referer.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Disable browser features unused by the panel.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
