# /etc/nginx/conf.d/panel.conf   ← PRODUCTION PHASE (HTTPS)
# ─────────────────────────────────────────────────────────────────────────────
# Oosoft SecurePanel — Nginx reverse proxy
# Replace panel-bootstrap.conf with this file after ssl-setup.sh succeeds.
#
# Topology:
#   Browser → Nginx (443 TLS) → FastAPI (Unix socket) → Agent (Unix socket)
# ─────────────────────────────────────────────────────────────────────────────

# ── Rate-limit zone (http{} scope) ───────────────────────────────────────────
# 10 MB shared memory ≈ 160 000 tracked IPs.
# Only declare once; remove if already declared in nginx.conf.
limit_req_zone $binary_remote_addr zone=panel_login:10m  rate=5r/m;
limit_req_zone $binary_remote_addr zone=panel_api:10m    rate=60r/m;

# ── Upstream (FastAPI via Unix socket) ───────────────────────────────────────
upstream securepanel_backend {
    server unix:/run/securepanel/api.sock;

    # Keep a small pool of persistent connections to the backend.
    keepalive 8;
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Server block 1 — HTTP  →  HTTPS redirect + ACME challenge
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
server {
    listen      80;
    listen      [::]:80;
    server_name panel.example.com;

    # Let certbot renew without switching to HTTP-only mode.
    location /.well-known/acme-challenge/ {
        root         /var/www/letsencrypt;
        default_type "text/plain";
        try_files    $uri =404;
    }

    # Everything else → permanent HTTPS redirect.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
# Server block 2 — HTTPS (TLS termination + reverse proxy)
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name panel.example.com;

    # ── Certificate (managed by certbot) ─────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/panel.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/panel.example.com/privkey.pem;

    # Certbot-supplied chain used for OCSP stapling verification.
    ssl_trusted_certificate /etc/letsencrypt/live/panel.example.com/chain.pem;

    # ── Shared TLS hardening (Mozilla Modern) ────────────────────────────────
    # This file is installed by ssl-setup.sh to /etc/nginx/snippets/
    include /etc/nginx/snippets/ssl-params.conf;

    # ── Content-Security-Policy ───────────────────────────────────────────────
    # Tight policy: SPA loads assets only from same origin; no inline scripts
    # (except style — React emotion/CSS-in-JS may need 'unsafe-inline').
    add_header Content-Security-Policy
        "default-src 'self'; "
        "script-src  'self'; "
        "style-src   'self' 'unsafe-inline'; "
        "img-src     'self' data:; "
        "font-src    'self'; "
        "connect-src 'self'; "
        "frame-ancestors 'none'; "
        "base-uri 'self'; "
        "form-action 'self';"
        always;

    # ── Logging ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/panel_access.log combined buffer=32k flush=5s;
    error_log  /var/log/nginx/panel_error.log  warn;

    # ── Global proxy settings (applied to all proxy_pass locations) ───────────
    proxy_http_version 1.1;

    # Required for keepalive connections to the upstream.
    proxy_set_header Connection "";

    # Standard forwarding headers.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;
    proxy_set_header X-Forwarded-Port  $server_port;

    # Prevent backend errors revealing themselves in nginx error pages.
    proxy_intercept_errors on;

    # ── Timeouts ──────────────────────────────────────────────────────────────
    proxy_connect_timeout  10s;
    proxy_send_timeout     60s;
    proxy_read_timeout    120s;   # allow long-running tasks (migrations, etc.)
    send_timeout           60s;

    # ── Buffer tuning ─────────────────────────────────────────────────────────
    proxy_buffering       on;
    proxy_buffer_size     8k;
    proxy_buffers         16 8k;
    proxy_busy_buffers_size 16k;

    # ── Request size ──────────────────────────────────────────────────────────
    # Migration uploads can be up to 10 GB; handled by the migration endpoint.
    # All other endpoints are capped at 10 MB here — FastAPI validates further.
    client_max_body_size 10m;

    # ── Location: auth/login — tightest rate limit ────────────────────────────
    location = /api/v1/auth/login {
        limit_req           zone=panel_login burst=3 nodelay;
        limit_req_status    429;

        proxy_pass          http://securepanel_backend;
        client_max_body_size 1m;
    }

    # ── Location: migration upload — large body, own timeout ─────────────────
    location = /api/v1/migration/upload {
        limit_req           zone=panel_api burst=2 nodelay;
        limit_req_status    429;

        proxy_pass          http://securepanel_backend;
        proxy_read_timeout  600s;    # uploads can take time
        client_max_body_size 10240m; # 10 GB
    }

    # ── Location: all other API routes ───────────────────────────────────────
    location /api/ {
        limit_req        zone=panel_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass       http://securepanel_backend;
    }

    # ── Location: React SPA (static assets) ──────────────────────────────────
    location / {
        root      /opt/oosoft-securepanel/frontend/dist;
        try_files $uri $uri/ /index.html;

        # Immutable hashed assets — cache for 1 year.
        location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|ico|webp)$ {
            expires    1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }

        # index.html must never be cached so the SPA can update.
        location = /index.html {
            expires   -1;
            add_header Cache-Control "no-store, no-cache, must-revalidate";
        }
    }

    # ── Location: block hidden files ─────────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Custom error pages (no internal path exposure) ───────────────────────
    error_page 400 401 403 404  /error.html;
    error_page 429              /429.html;
    error_page 500 502 503 504  /50x.html;

    location = /error.html { root /opt/oosoft-securepanel/frontend/dist; internal; }
    location = /429.html   { root /opt/oosoft-securepanel/frontend/dist; internal; }
    location = /50x.html   { root /opt/oosoft-securepanel/frontend/dist; internal; }
}
