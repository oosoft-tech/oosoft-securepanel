# /etc/nginx/conf.d/panel.conf   ← BOOTSTRAP PHASE (HTTP only)
# ─────────────────────────────────────────────────────────────────────────────
# Purpose: serve only the ACME webroot challenge so certbot can obtain the
#          initial certificate.  Replace this file with panel.conf (HTTPS)
#          immediately after ssl-setup.sh completes.
#
# Usage:
#   1. cp panel-bootstrap.conf /etc/nginx/conf.d/panel.conf
#   2. nginx -t && systemctl reload nginx
#   3. Run ssl-setup.sh
#   4. cp panel.conf /etc/nginx/conf.d/panel.conf
#   5. nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────────

# Rate-limit zone must be declared at http{} scope.
# If you already have a limit_req_zone elsewhere, remove the line below.
# limit_req_zone $binary_remote_addr zone=panel_login:10m rate=5r/m;

server {
    listen      80;
    listen      [::]:80;
    server_name panel.example.com;

    # ── ACME challenge — certbot writes here ──────────────────────────────────
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
        try_files $uri =404;
    }

    # Block everything else during bootstrap — do not expose FastAPI yet.
    location / {
        return 503 "Panel is being configured. Please try again shortly.";
        add_header Content-Type "text/plain" always;
    }
}
